[package]
name = "spacedb-sdk"
version = "0.5.2"
edition = "2021"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Remade-With-Rust/spacedb"
authors = ["Mata Network"]
homepage = "https://www.mata.network/"
documentation = "https://docs.rs/spacedb-sdk"
keywords = ["database", "crdt", "local-first", "offline-first", "sdk"]
categories = ["database", "database-implementations"]
description = "SpaceDB developer SDK — the one surface a developer picks up: an offline-first local replica with a per-field schema (CRDT type + consistency tier), mID-authorized + budgeted ops that each return their honest achieved consistency, reactive queries, and CRDT sync. Composes the whole SpaceDB stack. Phase 1 SpaceDB Mission, M8."
# Open-core (MIT). The capstone: it depends on the SpaceDB layers and ties them
# into one ergonomic API. No mata-* dependencies.

[lib]
crate-type = ["rlib"]

[dependencies]
# Optional so `default-features = false` genuinely removes it from the graph,
# not merely from a cfg.
rusty_alloc-api = { version = "=0.4.0", optional = true }
spacedb-crdt = { workspace = true }
spacedb-access = { workspace = true }
spacedb-consistency = { workspace = true }
spacedb-meter = { workspace = true }
thiserror = "1"

[features]
# ON by default, deliberately: SpaceDB replicas routinely run on machines their
# operator does not control, so an unconfigured node should be the hardened one.
# `default-features = false` is the developer-initiated override.
default = ["rusty-alloc"]
rusty-alloc = ["dep:rusty_alloc-api"]
# Guard pages + encrypted free lists. ~4-7% instructions (measured); worth it
# for a node exposed to untrusted input.
secure = ["rusty-alloc", "rusty_alloc-api/secure"]
