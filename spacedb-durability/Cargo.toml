[package]
name = "spacedb-durability"
version = "0.5.2"
edition = "2021"
rust-version = "1.95"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Remade-With-Rust/spacedb"
authors = ["Mata Network"]
homepage = "https://www.mata.network/"
documentation = "https://docs.rs/spacedb-durability"
keywords = ["erasure-coding", "durability", "storage", "replication", "mesh"]
categories = ["database", "algorithms"]
description = "SpaceDB Layer 2 (cold path) — mesh durability: seal a dataset into a content-addressed, Reed-Solomon erasure-coded snapshot and reconstruct it from any k-of-n surviving shards. The placement/shard-store/repair seams (M4-S2/S3) sit on top; MATA implements them over maestro-disco. Phase 1 SpaceDB Mission, M4."
# Open-core (MIT). S1 is pure erasure/manifest primitives over opaque (already-
# encrypted) snapshot bytes — no mata-* dependency, and no spacedb-* dependency
# yet (the store/crdt/replica composition arrives with the higher slices).

[lib]
crate-type = ["rlib"]

[dependencies]
# Reed-Solomon k-of-n erasure coding (GF(2^8), up to 256 shards), pure Rust with
# runtime-dispatched SIMD kernels. Uses the klauspost construction, byte-compatible
# with `reed-solomon-erasure` in both directions, so shards written before the
# migration remain recoverable and vice versa. MIT/Apache.
rusty_erasure = "0.4"

# Content addressing for snapshots and shards (MATA's content-address hash).
blake3 = "1"

# Manifest (de)serialization.
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }

# Typed errors.
thiserror = "1"

[dev-dependencies]
# Fuzz the core durability invariant: any k-of-n survivors reconstruct the exact
# original snapshot.
proptest = "1"

# The migration oracle: cross-decode tests prove shards encode/recover
# byte-identically against the crate this one replaced (klauspost construction).
# Remove after one published release survives in the wild.
reed-solomon-erasure = "6"
